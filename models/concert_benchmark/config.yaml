# CONCERT-spac config -- Visium HD CRISPR screen (SPAC-seq)
#
# Integrated model -- all components enabled by default.
# To ablate a component, set the corresponding flag to false.

maxiter: 5000
patience: 300
lr: 1.0e-4
weight_decay: 1.0e-6
encoder_dim: 256
GP_dim: 2
Normal_dim: 8
encoder_layers: [128, 64]
decoder_layers: [128]
noise: 0.1
dropoutE: 0.1
dropoutD: 0.0
KL_loss: 0.025
dynamicVAE: true
init_beta: 10.0
min_beta: 5.0
max_beta: 25.0
inducing_point_steps: 6
grid_inducing_points: true
loc_range: 20.0
kernel_scale: 10.0
multi_kernel_mode: true
fix_inducing_points: true
fixed_gp_params: false

# HVG selection (var['hvg_rank'] <= hvg_max_rank)
hvg_max_rank: 10000

# Explicit action correction (conceptual centerpiece)
# 3-term decoder: log mu = f_basal + 1[has_guide]*mu_action + 1[is_real_KO]*f_pert
use_action_correction: true

# PAD -- downgraded to soft regularizer (main removal via mu_action above)
use_pad: true
pad_action_dim: 64
pad_lambda_mmd: 0.1   # was 1.0 -- reduced to avoid over-suppression
pad_lambda_adv: 0.01  # was 0.1 -- reduced to avoid over-suppression

# SPAC-seq batch size for H100
batch_size: 2048
